[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "closeup-ortho"
version = "0.1.0"
description = "Simple planar projection (orthorectification) of DJI nadir close-up drone photos onto a DSM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Etienne Laliberte" }]
dependencies = [
    "rasterio>=1.3",
    "geopandas>=1.0",
    "pyproj>=3.5",
    "shapely>=2.0",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.scripts]
closeup-ortho = "closeup_ortho.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
